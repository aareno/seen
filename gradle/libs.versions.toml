[versions]
agp = "8.9.2"
firebaseAuth = "23.2.0"
firebaseBom = "33.13.0"
firebaseCore = "21.1.1"
firebaseFirestore = "25.1.4"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.0"
material = "1.12.0"
okhttp = "4.12.0"
glide = "4.16.0"
playServicesAuth = "21.3.0"
